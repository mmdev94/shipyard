name: Idea
description: Something Shipyard should do, or do better.
title: "[Idea] "
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What's the idea?
      description: What would you like Shipyard to do, and what would it help you with?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Anything else?
  - type: textarea
    id: context
    attributes:
      label: Details from Shipyard
      render: text
